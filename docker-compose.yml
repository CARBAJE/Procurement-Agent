services:

  # ── Lambda 1: Intention Parser ─────────────────────────────────────────────
  intention-parser:
    restart: unless-stopped
    build: ./services/intention-parser
    ports:
      - "8001:8001"
    volumes:
      - ./IntentParser:/app/IntentParser    # repo module mounted at runtime
      - ./shared:/app/shared                # shared models
    environment:
      # Host Ollama (GPU). Reachable now that UFW allows docker bridges → :11434.
      - OLLAMA_URL=http://host.docker.internal:11434/v1
      # Use qwen3:8b (present on the host daemon; qwen3:1.7b is not loaded there).
      - COMPLEX_MODEL=qwen3:8b
      - SIMPLE_MODEL=qwen3:8b
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: resolve host Ollama
    networks:
      - beckn_network

  # ── Lambda 2: Beckn BAP Client ─────────────────────────────────────────────
  beckn-bap-client:
    restart: unless-stopped
    build:
      context: .                                     # repo root — Dockerfile COPYs shared/
      dockerfile: ./services/beckn-bap-client/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ONIX_URL=http://onix-bap:8081
      - BAP_URI=http://beckn-bap-client:8002
      - BAP_ID=bap.example.com
      - DOMAIN=beckn.one/testnet
      - CALLBACK_TIMEOUT=10.0
      - CATALOG_NORMALIZER_URL=http://catalog-normalizer:8005
      - REDIS_URL=redis://redis:6379
    networks:
      - beckn_network
    depends_on:
      redis:
        condition: service_healthy
      catalog-normalizer:
        condition: service_started

  # ── Lambda 4: Catalog Normalizer ───────────────────────────────────────────
  catalog-normalizer:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/catalog-normalizer/Dockerfile
    ports:
      - "8005:8005"
    volumes:
      - ./CatalogNormalizer:/app/CatalogNormalizer   # repo module mounted at runtime
      - ./shared:/app/shared                          # shared models
    environment:
      # Host Ollama (GPU). Reachable now that UFW allows docker bridges → :11434.
      - OLLAMA_URL=http://host.docker.internal:11434/v1
      - NORMALIZER_MODEL=qwen3:1.7b
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: resolve host Ollama
    networks:
      - beckn_network

  # ── Lambda 3: Comparative & Scoring ────────────────────────────────────────
  comparative-scoring:
    restart: unless-stopped
    build: ./services/comparative-scoring
    ports:
      - "8003:8003"
    volumes:
      - ./ComparativeScoring:/app/ComparativeScoring   # repo module mounted at runtime
    networks:
      - beckn_network

  # ── Lambda 5: Data Normalizer — persistence bridge ─────────────────────────
  data-normalizer:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/data-normalizer/Dockerfile
    ports:
      - "8006:8006"
    volumes:
      - ./DataNormalizer:/app/DataNormalizer   # repo module mounted at runtime
      - ./shared:/app/shared                   # shared models
    environment:
      # PostgreSQL — single source of truth: root .env (see .env.example)
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-procurement_agent}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - PYTHONPATH=/app
    networks:
      - beckn_network

  # ── Lambda 6: Analytics ────────────────────────────────────────────────────
  # Port 8009 (was 8006 — moved to coexist with data-normalizer on 8006).
  analytics:
    restart: unless-stopped
    build: ./services/analytics
    ports:
      - "8009:8009"
    environment:
      - DB_HOST=procurement-postgres
      - DB_PORT=5432
      - DB_NAME=procurement_agent
      - DB_USER=postgres
      - DB_PASSWORD=postgres123
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - beckn_network

  # ── Orchestrator: Step Functions local simulator ───────────────────────────
  orchestrator:
    restart: unless-stopped
    build: ./services/orchestrator
    ports:
      - "8000:8004"   # matches frontend .env.local BAP_URL/INTENT_PARSER_URL defaults
      - "8004:8004"   # keep for direct testing
    environment:
      - INTENTION_PARSER_URL=http://intention-parser:8001
      - BECKN_BAP_URL=http://beckn-bap-client:8002
      - COMPARATIVE_SCORING_URL=http://comparative-scoring:8003
      - DATA_NORMALIZER_URL=http://data-normalizer:8006
      - ANALYTICS_URL=http://analytics:8009
      # ERP adapter — read by erp.ErpAdapterClient in workflow.py
      - ERP_ADAPTER_URL=http://erp-adapter:8007
      - ERP_INTERNAL_TOKEN=dev-internal-token-CHANGE_ME
      - ERP_BUDGET_CHECK_ENABLED=true
      - ERP_BUDGET_CHECK_REQUIRED=false
      - ERP_BUDGET_CHECK_TIMEOUT_MS=800
      - ERP_SYNC_ENABLED=true
      - ERP_DEFAULT_COST_CENTER=CC-IND-PROC-01
      # Buyer billing — read by _build_billing_info() in workflow.py
      - BUYER_NAME=Infosys Limited - Procurement Desk
      - BUYER_EMAIL=procurement@infosys.com
      - BUYER_PHONE=+91-80-28520261
      - BUYER_ADDRESS_STREET=Electronic City Phase 1
      - BUYER_ADDRESS_CITY=Bangalore
      - BUYER_ADDRESS_STATE=Karnataka
      - BUYER_ADDRESS_AREA_CODE=560100
      - BUYER_ADDRESS_COUNTRY=IND
      # Kafka (real-time tracking)
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=po.status.changed
      - KAFKA_GROUP_ID=orchestrator-ws-broker
      # Seller webhook HMAC secret
      - SELLER_WEBHOOK_HMAC_SECRET=dev-seller-hmac-CHANGE_ME
    networks:
      - beckn_network
    depends_on:
      intention-parser:
        condition: service_started
      beckn-bap-client:
        condition: service_started
      comparative-scoring:
        condition: service_started
      data-normalizer:
        condition: service_started
      analytics:
        condition: service_started
      erp-adapter:
        condition: service_started
      kafka:
        condition: service_healthy

  # ── ERP Adapter (vendor-neutral SAP/Oracle integration) ────────────────────
  erp-adapter:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/erp-adapter/Dockerfile
    ports:
      - "8007:8007"
    environment:
      # PostgreSQL — single source of truth: root .env (see .env.example).
      # Falls back to InMemoryOutboxRepo silently if the DB is unreachable.
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-procurement_agent}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres123}
      - REDIS_URL=redis://redis:6379
      - ERP_VENDORS=mock                       # override to sap | oracle | sap,oracle
      - ERP_INTERNAL_TOKEN=dev-internal-token-CHANGE_ME
      - ERP_MOCK_BASE_URL=http://erp-mock:8008
      - SAP_OAUTH_TOKEN_URL=http://erp-mock:8008/sap/oauth2/token
      - SAP_BASE_URL=http://erp-mock:8008/sap/opu/odata/sap/API_PURCHASEORDER_PROCESS_SRV
      - SAP_CLIENT_ID=mock-sap-client
      - SAP_CLIENT_SECRET=mock-sap-secret
      - SAP_WEBHOOK_HMAC_SECRET=dev-sap-hmac-CHANGE_ME
      - ORACLE_OAUTH_TOKEN_URL=http://erp-mock:8008/oauth2/v1/token
      - ORACLE_BASE_URL=http://erp-mock:8008/fscmRestApi/resources/11.13.18.05
      - ORACLE_CLIENT_ID=mock-oracle-client
      - ORACLE_CLIENT_SECRET=mock-oracle-secret
      - ORACLE_WEBHOOK_HMAC_SECRET=dev-oracle-hmac-CHANGE_ME
      - WORKER_CONCURRENCY=10
      # Kafka (real-time tracking) — published on inbound webhooks
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=po.status.changed
    networks:
      - beckn_network
    depends_on:
      redis:
        condition: service_healthy
      erp-mock:
        condition: service_started
      kafka:
        condition: service_healthy
    # Note: requires `procurement-postgres` reachable on the `beckn_network`
    # with the schema already applied. See database/README.md for the
    # one-time manual init step. Falls back to InMemoryOutboxRepo silently
    # if the DB is unreachable.

  # ── ERP Mock (emulates SAP OData v4 + Oracle ERP Cloud REST) ───────────────
  erp-mock:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./services/erp-mock/Dockerfile
    ports:
      - "8008:8008"
    environment:
      - MOCK_SCENARIO=happy
      - WEBHOOK_TARGET_URL=http://erp-adapter:8007
      - WEBHOOK_DELAY_SECONDS=2
      - SAP_WEBHOOK_HMAC_SECRET=dev-sap-hmac-CHANGE_ME
      - ORACLE_WEBHOOK_HMAC_SECRET=dev-oracle-hmac-CHANGE_ME
    networks:
      - beckn_network

  # ── Redis — shared cache for ONIX adapters ─────────────────────────────────
  redis:
    restart: unless-stopped
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Kafka — event bus for real-time order tracking (KRaft mode) ────────────
  # Single broker, no Zookeeper. Topic `po.status.changed` is auto-created.
  # Producers: orchestrator (/status poll + seller webhook) + erp-adapter.
  # Consumers: orchestrator (WebSocket broker) + notification-dispatcher.
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Notification Dispatcher — consumes Kafka, fans out to Slack/Teams/Email ─
  notification-dispatcher:
    build:
      context: .
      dockerfile: ./services/notification-dispatcher/Dockerfile
    container_name: notification-dispatcher
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=po.status.changed
      - KAFKA_GROUP_ID=notification-dispatcher
      # Leave empty to skip that channel. Configure in .env for real delivery.
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@procurement-agent.local}
      - DB_HOST=host.docker.internal
      - DB_PORT=5432
      - DB_NAME=procurement_agent
      - DB_USER=cristianmontiel
      - DB_PASSWORD=
      - PYTHONPATH=/app
    networks:
      - beckn_network
    depends_on:
      kafka:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── onix-bap — BAP ONIX adapter ────────────────────────────────────────────
  #   Caller  (outbound): http://onix-bap:8081/bap/caller/
  #   Receiver (inbound): http://onix-bap:8081/bap/receiver/
  #   BAPCaller.yaml   → routes discover to beckn-bap-client:8002/bpp/discover
  #   BAPReceiver.yaml → routes on_* callbacks to beckn-bap-client:8002/bap/receiver
  onix-bap:
    image: fidedocker/onix-adapter
    container_name: onix-bap
    platform: linux/amd64
    networks:
      - beckn_network
    ports:
      - "8081:8081"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - ./config:/app/config
    command: ["./server", "--config=/app/config/generic-bap.yaml"]

  # ── onix-bpp — BPP ONIX adapter ────────────────────────────────────────────
  #   Caller  (outbound): http://onix-bpp:8082/bpp/caller/
  #   Receiver (inbound): http://onix-bpp:8082/bpp/receiver/
  onix-bpp:
    image: fidedocker/onix-adapter
    container_name: onix-bpp
    platform: linux/amd64
    networks:
      - beckn_network
    ports:
      - "8082:8082"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
    volumes:
      - ./config:/app/config
    command: ["./server", "--config=/app/config/generic-bpp.yaml"]

  # ── sim-bpp — unified simulated Beckn v2.0.0 BPP ──────────────────────────
  #   Replaces the transaction-only sandbox-2.0 image. Answers the FULL
  #   lifecycle (discover + transactions) behind onix-bpp, so discovery now
  #   travels the same signed + schema-validated path as a real Beckn network.
  #   Receives action requests at: http://sim-bpp:3002/api/webhook/{action}
  #   Emits on_{action} callbacks to onix-bpp:8082/bpp/caller/on_{action}.
  #   Edit catalog.json (bind-mounted) to change the catalog without a rebuild.
  sim-bpp:
    restart: unless-stopped
    container_name: sim-bpp
    build:
      context: .
      dockerfile: ./services/sim-bpp/Dockerfile
    environment:
      - PORT=3002
      - ONIX_BPP_CALLER=http://onix-bpp:8082/bpp/caller
      - BPP_ID=bpp.example.com
      - BPP_URI=http://onix-bpp:8082/bpp/receiver
      - CATALOG_PATH=/app/catalog.json
      # Auto-advance the Beckn fulfillment lifecycle after /confirm.
      # Default OFF preserves manual-test workflows (curl webhook, kafka producer).
      # Set to "true" to demo a realistic BPP that pushes ACCEPTED → PACKED →
      # SHIPPED → OUT_FOR_DELIVERY → DELIVERED autonomously.
      - SIM_BPP_AUTO_ADVANCE=${SIM_BPP_AUTO_ADVANCE:-false}
      - SIM_BPP_ADVANCE_INTERVAL_SECS=${SIM_BPP_ADVANCE_INTERVAL_SECS:-5}
      # Kafka + data-normalizer endpoints (used only when auto-advance is on)
      - KAFKA_BOOTSTRAP=kafka:9092
      - KAFKA_TOPIC=po.status.changed
      - DATA_NORMALIZER_URL=http://data-normalizer:8006
    ports:
      - "3002:3002"
    volumes:
      - ./services/sim-bpp/catalog.json:/app/catalog.json
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3002/api/health').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - beckn_network
    depends_on:
      kafka:
        condition: service_healthy

  # ── PostgreSQL — durable store for the Negotiation Engine ──────────────────
  #   Owns the `negotiation` DB: LangGraph AsyncPostgresSaver checkpoints
  #   (created by the engine at startup) + the negotiation_session/round/
  #   policy_decision audit tables (seeded from the mounted init scripts).
  #   NOTE: the procurement-pipeline services (data-normalizer, analytics,
  #   erp-adapter) point at an EXTERNAL `procurement_agent` DB via
  #   host.docker.internal:5432 and fall back to mock — they do not use this.
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: negotiation
    ports:
      - "55432:5432"
    volumes:
      - ./database/sql/20_negotiation_schema.sql:/docker-entrypoint-initdb.d/01_negotiation_schema.sql:ro
      - ./database/seed_negotiation_demo.sql:/docker-entrypoint-initdb.d/02_seed_negotiation_demo.sql:ro
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "negotiation"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Negotiation Engine (Phase 3 buyer agent) ───────────────────────────────
  #   LangGraph state machine: deterministic strategy + hard 20% guardrail,
  #   durable AsyncPostgresSaver checkpointer, Redis Pub/Sub resume broker
  #   (beckn_on_select_results). Env var names mirror src/config.py aliases.
  negotiation-engine:
    build:
      context: ./services/negotiation_engine
      dockerfile: Dockerfile
    container_name: negotiation-engine
    restart: unless-stopped
    ports:
      # Host :8004 is owned by the orchestrator (frontend procurement flow).
      # The engine is reached INTERNALLY by the demo-gateway via the docker
      # DNS name `negotiation-engine:8004`, so it needs no privileged host
      # port — expose 18004 for direct host-side debugging only.
      - "18004:8004"
    environment:
      NEGOTIATION_POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/negotiation
      REDIS_URL: redis://redis:6379/0
      NEGOTIATION_REDIS_ON_SELECT_CHANNEL: beckn_on_select_results
      NEGOTIATION_API_PORT: "8004"
      NEGOTIATION_LOG_LEVEL: INFO
      # Advisory LLM node → Claude Code proxy. Bridged container reaches the
      # host proxy via host.docker.internal:8012 (needs a UFW allow for
      # docker→host:8012; advisory branch falls back to a placeholder if it
      # can't connect, so the standard counter-offer flow is unaffected).
      OPENAI_API_KEY: your-local-proxy-key
      NEGOTIATION_OPENAI_BASE_URL: http://host.docker.internal:8012/v1
      NEGOTIATION_OPENAI_MODEL: claude-3-5-sonnet
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - beckn_network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8004/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ── Demo Gateway (hosts the qwen3:8b Supplier Agent) ───────────────────────
  #   Proxies negotiation kickoff/poll to the engine and drives the LLM
  #   supplier counter-party (in-process), publishing its replies to Redis to
  #   resume the parked buyer graph.
  #
  #   network_mode: host — REQUIRED on this machine: nftables drops ALL
  #   docker-bridge → host traffic, so a bridged container cannot reach the
  #   host Ollama (127.0.0.1:11434). Sharing the host netns lets the gateway
  #   reach Ollama on localhost directly, with NO firewall/Ollama change and
  #   WITHOUT putting Ollama in compose. Consequence of host netns: no port
  #   mapping (binds host :8015 via the command override below), and engine/
  #   redis are reached via their published host ports, not docker DNS.
  demo-gateway:
    build:
      context: .
      dockerfile: ./services/frontend_demo_gateway/Dockerfile
    container_name: demo-gateway
    restart: unless-stopped
    network_mode: host
    command:
      - uvicorn
      - services.frontend_demo_gateway.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8015"
    environment:
      NEGOTIATION_ENGINE_URL: http://localhost:18004
      REDIS_URL: redis://localhost:6379/0
      REDIS_ON_SELECT_CHANNEL: beckn_on_select_results
      # MIGRATED to the Claude Code OpenAI proxy (host-networked → localhost:8012).
      OLLAMA_BASE_URL: http://localhost:8012/v1
      OLLAMA_API_KEY: your-local-proxy-key
      SUPPLIER_MODEL: claude-3-5-sonnet
      BUYER_HUMANIZE_MODEL: gpt-4o-mini
      SUPPLIER_ACCEPTABLE_DISCOUNT_FLOOR: "0.10"
      SUPPLIER_MAX_ROUNDS: "3"
    depends_on:
      negotiation-engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /healthz is liveness-only (does NOT probe Ollama) so the 15s probe
      # never competes with qwen3 inference on the GPU during a negotiation.
      test: ["CMD", "curl", "-fsS", "http://localhost:8015/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

networks:
  beckn_network:
    name: beckn_network
    driver: bridge
