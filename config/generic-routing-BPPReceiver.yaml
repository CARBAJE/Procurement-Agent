# BPP Receiver Routing — inbound action requests from BAPs to the BPP
#
# All action requests are forwarded to the sim-bpp webhook container.
# sim-bpp processes the request and generates the on_* callback (discover too).

routingRules:
  - networkId: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "url"
    target:
      url: "http://sim-bpp:3002/api/webhook"
    endpoints:
      - discover
      - select
      - init
      - confirm
      - status
      - track
      - update
      - cancel
      - rate
      - support
      - on_publish
