# BAP Caller Routing — outbound requests from BAP to BPPs / CDS
#
# ALL actions (discover + transactions) are routed directly to onix-bpp (bypasses
# DeDi registry lookup — bpp.example.com is a local sim-bpp, not registered
# externally). This makes discovery travel the SAME signed + schema-validated path
# as a real Beckn network. To go live: switch targetType "url" → "bpp" so onix
# resolves the BPP URI by bppId via the DeDi registry.
# All services share the beckn_network so the container name resolves directly.

routingRules:
  # All actions: routed directly to onix-bpp BPP receiver.
  # ONIX appends the action name: http://onix-bpp:8082/bpp/receiver + /discover, /init, etc.
  # onix-bpp BPP Receiver then forwards to sim-bpp:3002/api/webhook.
  - domain: "beckn.one/testnet"
    version: "2.0.0"
    targetType: "url"
    target:
      url: "http://onix-bpp:8082/bpp/receiver"
    endpoints:
      - discover
      - select
      - init
      - confirm
      - status
      - track
      - update
      - cancel
      - rate
      - support
