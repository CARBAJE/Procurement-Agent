[pytest]
# Local pytest config for the Negotiation Engine service.
#
# `asyncio_mode = auto` lets async-def tests run without an explicit
# `@pytest.mark.asyncio` decorator — matches the convention documented
# in CLAUDE.md and used by sibling services.

asyncio_mode = auto
testpaths = tests
addopts = -v --disable-warnings --tb=short

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
