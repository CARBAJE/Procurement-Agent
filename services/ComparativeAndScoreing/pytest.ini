[pytest]
# Anchor pythonpath at the service root so `from core.X`, `from prediction_api.X`,
# `from training_pipeline.X`, `from validation_service.X` all resolve cleanly —
# matching the Docker WORKDIR=/app layout exactly.
pythonpath = .
testpaths = tests

# Per CLAUDE.md project convention: async test functions auto-detected, no
# decorator required. Used by any future async endpoint tests.
asyncio_mode = auto

# Default invocation flags. `pytest` alone gives verbose output without warnings.
addopts = -v --disable-warnings --tb=short

# Filter the most common noise from third-party deps (mlflow + torch emit
# many DeprecationWarnings on Python 3.11).
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:mlflow

# Mark test files so pytest finds them without scanning the whole tree.
python_files = test_*.py
python_classes = Test*
python_functions = test_*
